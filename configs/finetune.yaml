# Fine-tuning protocol. Defaults follow Chinese MentalBERT (lr 2e-5, batch 16, <=10 epochs,
# best-dev checkpoint evaluated on test). Every run is repeated over `seeds`.
# batch_size is per GPU. A run that sees 2 GPUs (DataParallel) has an effective batch of 32; the
# Chinese MentalBERT sanity-check runs on Kaggle did. The MATCHA runs use one GPU each
# (finetune_one_run_per_gpu in configs/pipeline_mentalbert.yaml), so 16. metrics.json records the value.
task_root: data/tasks
output_root: outputs/finetune
seeds: [42, 43, 44]

# tag -> Hugging Face id or local path
models:
  bert-base-chinese: bert-base-chinese
  bert-wwm-ext: hfl/chinese-bert-wwm-ext
  chinese-mentalbert: zwzzz/Chinese-MentalBERT
  matcha-random: outputs/dapt/random/final
  matcha-depression: outputs/dapt/depression/final
  matcha-multidisorder: outputs/dapt/multidisorder/final
  # RoBERTa baseline (Murarka et al., LOUHI 2021): the paper's roberta-base reads English only, so
  # on MATCHA it is HFL's Chinese RoBERTa (BERT architecture trained the RoBERTa way: no next-
  # sentence prediction, more data and steps; whole-word masking), the sibling of bert-wwm-ext.
  # roberta-base itself runs the sanity check on the paper's Reddit data (configs/finetune_reddit.yaml).
  roberta-wwm-ext: hfl/chinese-roberta-wwm-ext
  roberta-base: FacebookAI/roberta-base

defaults:
  epochs: 10
  learning_rate: 2.0e-5
  batch_size: 16
  grad_accum: 1
  warmup_ratio: 0.0
  weight_decay: 0.0
  early_stopping_patience: 3     # stops after 3 epochs without dev improvement (best-dev selection is unchanged)
  class_weight: null
  max_length: null               # null -> task default (128 post-level, 512 user-level)
  classifier_dropout: null       # null -> the model's own (0.1)
  keep_checkpoints: false

task_overrides:
  matcha_disorder_post: {class_weight: balanced}
  matcha_disorder_post_masked: {class_weight: balanced}
  matcha_user_binary: {epochs: 6, early_stopping_patience: 2}
  matcha_user_binary_masked: {epochs: 6, early_stopping_patience: 2}
  matcha_user_multiclass: {epochs: 6, early_stopping_patience: 2, class_weight: balanced}
  matcha_user_multiclass_masked: {epochs: 6, early_stopping_patience: 2, class_weight: balanced}

# Settings that differ for one model tag (applied after defaults and task_overrides).
# The RoBERTa models use Murarka et al.'s recipe: Adam, lr 1e-5, 10 epochs (no early stopping),
# batch 16 for posts, dropout 0.3 before the classification layer, 512 tokens. Not given in the
# paper, so kept as for every other model: no warm-up, linear decay, best dev epoch, and the task's
# class weights (their Reddit classes were balanced; MATCHA's are not).
model_overrides:
  roberta-wwm-ext: &murarka2021 {learning_rate: 1.0e-5, epochs: 10, early_stopping_patience: null,
                                 classifier_dropout: 0.3, max_length: 512}
  roberta-base: *murarka2021
