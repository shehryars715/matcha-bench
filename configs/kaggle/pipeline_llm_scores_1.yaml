# Label probabilities of the final MentalGLM runs trained in lane 1 (bigbug44, kept through session
# 1-run-005): disorder_post_masked seed 44 and user_multiclass_masked seeds 42-44 (scripts/run_llm_scores.py).
#   python scripts/kaggle/kaggle_pipeline.py start --lane 1 --pipeline configs/kaggle/pipeline_llm_scores_1.yaml
# Inference only, one run per T4; an unfinished split resumes from its last saved chunk next session.
budget_hours: 8.0
safety_margin_minutes: 20
finetune_one_run_per_gpu: true

stages:
  - name: llm-packages
    type: pip
    packages: ["peft>=0.13", "bitsandbytes>=0.45", "transformers>=4.46"]
  - name: llm-scores-check        # 500 test items per task; a failure ends the session here
    type: finetune
    script: scripts/run_llm_scores.py
    config: configs/kaggle/llm_scores_probe.yaml
    prepare: [scripts/run_llm_scores.py, --tasks, matcha_disorder_post_masked, --models, mentalglm-chat-full, --prepare-only]
    tasks: [matcha_disorder_post_masked, matcha_user_multiclass_masked]
    models: [mentalglm-chat-full]
    seeds: {matcha_disorder_post_masked: [44], matcha_user_multiclass_masked: [42]}
    minutes_per_run: {default: 15}
  - name: llm-scores
    type: finetune
    script: scripts/run_llm_scores.py
    config: configs/llm_scores.yaml
    prepare: [scripts/run_llm_scores.py, --tasks, matcha_disorder_post_masked, --models, mentalglm-chat-full, --prepare-only]
    tasks: [matcha_disorder_post_masked, matcha_user_multiclass_masked]
    models: [mentalglm-chat-full]
    seeds: {matcha_disorder_post_masked: [44], matcha_user_multiclass_masked: [42, 43, 44]}
    minutes_per_run: {default: 20}
