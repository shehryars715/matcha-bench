# Lexicons that guide masking.
processed_dir: data/processed
lexicon_dir: lexicons

# 1) Depression lexicon used by Chinese MentalBERT (Li et al., 2020).
depression:
  output: lexicons/lexicon_depression.txt

# 2) Candidate mining from MATCHA training users (log-odds vs control, Monroe et al. 2008).
mining:
  output: lexicons/candidates.csv
  alpha0: 1000.0
  z_min: 3.0
  min_users: 5          # k-anonymity: a word must be used by >= 5 distinct users
  top_k: 1500           # per disorder

# 3) Word-level filtering of the candidates -> multi-disorder lexicon (used by configs/dapt/multidisorder.yaml).
#    lexicons/llm_annotations.csv lists every kept word with its category (word,category).
multidisorder:
  annotations: lexicons/llm_annotations.csv
  annotated_candidates: lexicons/multidisorder_annotations.csv
  consensus_with: lexicons/deepseek_annotations.csv   # keep only words both annotators keep (null = annotator A alone)
  output: lexicons/lexicon_multidisorder.txt
  exclude_categories: []            # e.g. [clinical] to drop diagnosis / medication terms
  header: "MATCHA multi-disorder lexicon: log-odds mining + consensus of two LLM annotators"

# 3') Optional alternative filter: DeepSeek API, 3 votes (only words are sent, never posts).
deepseek:
  model: deepseek-chat              # check the current model name on api-docs.deepseek.com
  base_url: https://api.deepseek.com
  temperature: 0.7
  votes: 3                          # majority vote; agreement rate is reported
  batch_size: 100
  max_workers: 8                    # concurrent API calls
  price_per_m_input: 0.28           # USD per 1M tokens: verify on the DeepSeek pricing page
  price_per_m_output: 0.42
  exclude_categories: []            # e.g. [clinical] to drop diagnosis / medication terms
  cache: lexicons/deepseek_cache.jsonl
  annotations: lexicons/deepseek_annotations.csv
  output: lexicons/lexicon_deepseek.txt
