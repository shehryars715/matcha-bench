# Zero-shot LLM scores on the MATCHA tasks (scripts/run_llm_zeroshot.py): the released models with no
# MATCHA training, as MentalGLM's Table 3 reports zero-shot LLMs. Everything else (prompts, inputs,
# 4-bit weights, eval batch, answer parsing) comes from configs/llm.yaml, so the only difference from
# the fine-tuned runs is the training.
base: llm.yaml
output_root: outputs/llm/zeroshot      # <task>/<model>/seed0/metrics.json
seeds: [0]                             # greedy decoding is deterministic: one run per model
defaults:
  # The fine-tuned runs' 24-token cap fits their trained one-line answer. Untrained GLM-4-9B-chat opens
  # with a preamble ("根据帖子内容，...") and was cut off before the label in ~80% of its unparsed
  # answers (session 1-run-004), so zero-shot answers get room for a full first sentence (generation
  # still stops at the first "。", and only that sentence is parsed, as in MentalGLM's evaluation).
  # MentalGLM-chat's run-004 answers (cap 24) had at most 12 cut off per task.
  max_new_tokens: 96

# The reported MentalGLM-chat zero-shot rows were generated with the fine-tuned runs' 24-token cap
# (sessions 1-run-004/005); kept so a rerun reproduces them. GLM-4-9B-chat uses the 96 above.
model_overrides:
  mentalglm-chat: {max_new_tokens: 24}
