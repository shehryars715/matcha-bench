# The baseline pipeline, run in time-limited sessions by scripts/run_pipeline.py.
# Every session restores outputs/ from the previous one, skips finished work, resumes the
# unfinished DAPT run from its last checkpoint, and stops cleanly before the time budget ends.
# Stage 1 of the project: these runs produce the baseline scores on MATCHA that later methods
# are compared against.
budget_hours: 9.0
safety_margin_minutes: 30        # stop this long before the budget so outputs are saved
# Fine-tune one (task, model, seed) per GPU at the same time, each with a true batch of 16,
# instead of one run split across both GPUs (DataParallel, effective batch 32). Turned on
# 2026-10-13 for the MATCHA tasks; the Chinese MentalBERT sanity-check runs before that used 32.
finetune_one_run_per_gpu: true

stages:
  - name: preflight              # tiny CPU/GPU check (~2 min), skipped once it has passed
    type: preflight
  - name: dapt-random
    type: dapt
    config: configs/dapt/random.yaml
  - name: dapt-depression
    type: dapt
    config: configs/dapt/depression.yaml
  - name: dapt-multidisorder
    type: dapt
    config: configs/dapt/multidisorder.yaml
  # Sanity check: four of the Chinese MentalBERT paper's evaluation tasks, every model and seed.
  # ewect_usual was stopped after 7 of 18 runs to save GPU time (append it here to finish it).
  - name: finetune-mentalbert
    type: finetune
    config: configs/finetune.yaml
    tasks: [suicide, cognitive, waimai, ewect_epidemic]
    models: [bert-wwm-ext, matcha-random, matcha-depression, matcha-multidisorder, chinese-mentalbert, bert-base-chinese]
    # minutes to reserve before starting one (task, model, seed) run; unlisted tasks use default
    minutes_per_run: {default: 20, ewect_usual: 40}
  # MATCHA baselines: the core four tasks. Models: the Chinese MentalBERT paper's comparison minus
  # bert-base-chinese (dropped to save GPU time; it trails bert-wwm-ext everywhere so far);
  # matcha-multidisorder can be added later. Paused to save GPU time, append to run them:
  #   matcha_ip_post, matcha_user_binary, matcha_user_multiclass (the unmasked user-level twins)
  - name: finetune-matcha
    type: finetune
    config: configs/finetune.yaml
    tasks: [matcha_disorder_post, matcha_disorder_post_masked,
            matcha_user_binary_masked, matcha_user_multiclass_masked]
    models: [bert-wwm-ext, matcha-random, matcha-depression, chinese-mentalbert]
    # one GPU per run, so runs take longer than the 2-GPU timings measured so far (re-measure)
    minutes_per_run: {default: 25, matcha_ip_post: 50, matcha_disorder_post: 55,
                      matcha_disorder_post_masked: 55, matcha_user_multiclass: 60, matcha_user_multiclass_masked: 60}
  - name: tfidf
    type: tfidf
  - name: summary
    type: summary
    # paired-bootstrap tests, one-sided "A beats B", on every task both models ran
    compare:
      - [matcha-random, bert-wwm-ext]             # corpus effect: does pre-training on MATCHA help?
      - [matcha-depression, matcha-random]        # lexicon effect: the Chinese MentalBERT claim
      - [matcha-depression, chinese-mentalbert]   # MATCHA corpus vs the published model's corpus
      - [matcha-multidisorder, matcha-random]     # multi-disorder lexicon (Chinese MentalBERT tasks only for now)
