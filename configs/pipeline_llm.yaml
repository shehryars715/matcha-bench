# LLM baseline pipeline (stage 1b, MentalGLM on MATCHA), run in Kaggle sessions like the BERT one:
#   python scripts/kaggle_pipeline.py start --pipeline configs/pipeline_llm.yaml
# Settings for the models, prompts and LoRA training are in configs/llm.yaml.
#
# Sessions 5-6 ran the sanity check and the timing probes (both are skipped once done). The probes
# (T4, 4-bit, batch 4 x 8) measured 16.5 s per optimizer step on posts (~95 tokens) and 49 s on user
# timelines (~400 tokens); generation labels 4.9 posts/s and 1.7 timelines/s. Per run, 2 epochs on
# up to 4,000 examples with dev checks and the test pass: disorder_post(+masked) ~80 min,
# user_binary_masked ~140, user_multiclass_masked ~240; 12 runs ~27 GPU-h, ~14 h with 2 GPUs.
budget_hours: 9.0
safety_margin_minutes: 30
finetune_one_run_per_gpu: true   # one 4-bit LoRA run per T4

stages:
  - name: llm-packages
    type: pip
    packages: ["peft>=0.13", "bitsandbytes>=0.45", "transformers>=4.46"]
  # The released MentalGLM-chat on its own test sets (SOS-HL-1K, SocialCD-3K), in fp16 over both
  # GPUs and in 4-bit on one; downloads and converts the model first (~19 GB, kept in /tmp).
  - name: llm-sanity
    type: llm_sanity
    config: configs/llm.yaml
    minutes: 60
  # A few LoRA steps and a 64-item generation pass on the shortest and the longest MATCHA inputs.
  - name: llm-probe
    type: llm_probe
    config: configs/llm.yaml
    tasks: [matcha_disorder_post_masked, matcha_user_multiclass_masked]
    models: [mentalglm-chat]
    steps: 6
    minutes_per_task: 25
  # The MATCHA baseline: one 4-bit LoRA run per GPU; longest task first so sessions pack better.
  - name: finetune-llm
    type: finetune
    script: scripts/run_llm_finetune.py
    config: configs/llm.yaml
    prepare: [scripts/run_llm_finetune.py, --tasks, matcha_user_binary_masked, --models, mentalglm-chat, --prepare-only]
    # Runs tested on fewer items than configs/llm.yaml now asks for (the 2,000-post subsets) are
    # re-queued; they only repeat the test pass with their saved adapter (20,000 posts at 4.9/s ~70 min).
    before: [scripts/run_llm_finetune.py, --tasks, all, --models, mentalglm-chat, --archive-smaller-tests]
    tasks: [matcha_user_multiclass_masked, matcha_user_binary_masked, matcha_disorder_post, matcha_disorder_post_masked]
    models: [mentalglm-chat]
    minutes_per_run: {default: 95, matcha_user_multiclass_masked: 260, matcha_user_binary_masked: 155}
  # Pilot (2026-10-19): does the 4,000-example training cap cost score? Seed 42 on all training data
  # (23,109 posts, 6,919 users), everything else unchanged, against the capped seed-42 runs. Decision
  # rule fixed in advance: full-data training for the other tasks only if the gain is significant
  # (paired bootstrap, same seed and test set) and larger than the seed-to-seed spread.
  # Estimates: disorder_post ~2 x 3.3 h training + 70 min test ~ 8 h; user_multiclass ~2 x 3 h + 21 min
  # ~ 6.5 h. One run per GPU, side by side. Training saves a resume point after each epoch, so a run cut
  # off by the session cap continues next session; a run starts once at least one epoch (~200 min) fits.
  - name: finetune-llm-pilot
    type: finetune
    script: scripts/run_llm_finetune.py
    config: configs/llm.yaml
    prepare: [scripts/run_llm_finetune.py, --tasks, matcha_user_binary_masked, --models, mentalglm-chat, --prepare-only]
    tasks: [matcha_disorder_post, matcha_user_multiclass_masked]
    models: [mentalglm-chat-fulldata]
    seeds: [42]
    minutes_per_run: {default: 200}
