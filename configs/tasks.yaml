# Downstream task construction. Every task is written to data/tasks/<name>/.
processed_dir: data/processed
task_root: data/tasks
mentalbert_raw_dir: data/raw/mentalbert
seed: 42

matcha:
  matcha_ip_post:
    builder: ip_post
    neg_per_pos_train: 3
    max_eval: 20000
  matcha_disorder_post:
    builder: disorder_post
    max_per_class_train: 5000
    max_eval: 20000
  matcha_disorder_post_masked:
    builder: disorder_post
    mask: true
    max_per_class_train: 5000
    max_eval: 20000
  matcha_user_binary:
    builder: user_binary
    positives: all
    min_posts: 5
    max_chars: 600
  matcha_user_binary_masked:
    builder: user_binary
    positives: all
    mask: true
    min_posts: 5
    max_chars: 600
  matcha_user_multiclass:
    builder: user_multiclass
    min_posts: 5
    max_chars: 600
    max_per_class_train: 1500
    max_per_class_eval: 500
  matcha_user_multiclass_masked:
    builder: user_multiclass
    mask: true
    min_posts: 5
    max_chars: 600
    max_per_class_train: 1500
    max_per_class_eval: 500

# Public datasets from the Chinese MentalBERT paper (download with scripts/download_mentalbert_data.py).
# c2d2 is skipped automatically unless data/raw/mentalbert/c2d2/{train,dev,test}.csv exist.
mentalbert: [ewect_usual, ewect_epidemic, waimai, cognitive, suicide, c2d2]
